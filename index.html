<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{
color:#152238;
background:#fff;
}


/* 顶部区域 */

header{

height:80px;

display:flex;

align-items:center;

justify-content:center;

background:white;

box-shadow:0 2px 10px #ddd;

}


/* LOGO */

.logo{

display:flex;

align-items:center;

font-size:24px;

font-weight:bold;

}


.logo img{

width:55px;

margin-right:12px;

}


/* 导航 */

nav{

display:block;

}


.nav-links{

display:flex;

align-items:center;

gap:30px;

}


.nav-links a{

text-decoration:none;

color:#152238;

font-weight:600;

font-size:15px;

}


/* 隐藏按钮 */

.mobile-toggle{

display:none;

}



/* HERO */

.hero{

height:650px;

background:

linear-gradient(
90deg,
rgba(0,0,0,.75),
rgba(0,0,0,.3)
),

url("https://images.unsplash.com/photo-1503376780353-7e6692767b70");


background-size:cover;

background-position:center;

display:flex;

align-items:center;

padding-left:8%;

color:white;

}


.hero h1{

font-size:52px;

max-width:650px;

}


.hero p{

font-size:20px;

margin:25px 0;

}


.btn{

display:inline-block;

background:#ff8a00;

color:white;

padding:15px 35px;

border-radius:30px;

text-decoration:none;

font-weight:bold;

}




/* 手机端 */

@media(max-width:768px){


header{

height:auto;

display:flex;

flex-direction:column;

padding:15px 0;

}


/* LOGO */

.logo{

font-size:22px;

margin-bottom:12px;

}


.logo img{

width:45px;

}


/* 手机导航显示 */

nav{

width:100%;

}


.nav-links{

display:none;

flex-direction:column;

position:absolute;

top:70px;

right:20px;

background:white;

width:200px;

padding:20px;

gap:15px;

border-radius:10px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

z-index:999;

}


.nav-links.active{

display:flex;

}

.nav-links a{

font-size:12px;

margin:0;

}


/* HERO */

.hero{

height:520px;

padding:25px;

align-items:center;

}



.hero h1{

font-size:32px;

line-height:1.15;

}


.hero p{

font-size:16px;

margin:18px 0;

}


.btn{

padding:13px 28px;

font-size:15px;

}



.cards{

grid-template-columns:1fr;

}


.process{

grid-template-columns:1fr;

}


.section{

padding:50px 20px;

}


}

</style>
